<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Store Settings | Dayli Need Shop</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/responsive.css">

<link rel="stylesheet" href="css/admin.css">

</head>

<body>

<div class="admin-container">

<!-- Sidebar -->

<aside class="sidebar">

<h2>Admin Panel</h2>

<ul>

<li><a href="dashboard.html">📊 Dashboard</a></li>

<li><a href="products.html">📦 Products</a></li>

<li><a href="categories.html">🗂️ Categories</a></li>

<li><a href="orders.html">🛒 Orders</a></li>

<li><a href="customers.html">👥 Customers</a></li>

<li><a href="settings.html">⚙️ Settings</a></li>

<li><a href="../index.html">🏠 Website</a></li>

</ul>

</aside>

<!-- Main Content -->

<main class="admin-main">

<header class="admin-header">

<h1>Store Settings</h1>

<p>Manage your store information</p>

</header>

<div class="settings-form">

<div class="form-group">

<label>Store Name</label>

<input type="text" value="Dayli Need Shop">

</div>

<div class="form-group">

<label>Store Email</label>

<input type="email" value="support@daylineedshop.com">

</div>

<div class="form-group">

<label>Phone Number</label>

<input type="text" value="+66 812345678">

</div>

<div class="form-group">

<label>Store Address</label>

<textarea rows="4">Bangkok, Thailand</textarea>

</div>
<div class="form-group">

<label>Store Logo</label>

<input type="file">

</div>

<div class="form-group">

<label>Default Payment Method</label>

<select>

<option>Cash on Delivery</option>

<option>PromptPay</option>

<option>Bank Transfer</option>

<option>Credit / Debit Card</option>

</select>

</div>

<div class="form-group">

<label>Delivery Charge (฿)</label>

<input type="number" value="50">

</div>

<div class="form-group">

<label>Store Status</label>

<select>

<option>Open</option>

<option>Closed</option>

<option>Maintenance</option>

</select>

</div>

<div class="form-group">

<button class="btn save-btn">

💾 Save Settings

</button>

</div>

</div>

</main>

</div>
<script src="js/admin.js"></script>
</body>

</html>
